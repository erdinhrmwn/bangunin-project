services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bangunin
      POSTGRES_PASSWORD: bangunin
      POSTGRES_DB: bangunin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bangunin"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.payment
    env_file:
      - ../.env
    environment:
      GRPC_ADDR: ":50051"
      HTTP_ADDR: ":8081"
      MONOLITH_CALLBACK_URL: "http://api:8080/internal/payments/callback"
      INTERNAL_SECRET: "${APP_PAYMENT_INTERNAL_SECRET}"
      XENDIT_SECRET_KEY: "${APP_XENDIT_SECRET_KEY}"
      XENDIT_CALLBACK_TOKEN: "${APP_XENDIT_CALLBACK_TOKEN}"
      MOCK: "${APP_XENDIT_MOCK:-true}"
    ports:
      - "50051:50051"
      - "8081:8081"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file:
      - ../.env
    environment:
      APP_DB_DSN: postgres://bangunin:bangunin@postgres:5432/bangunin?sslmode=disable
      APP_REDIS_ADDR: redis:6379
      APP_R2_ENDPOINT: minio:9000
      APP_PAYMENT_GRPC_ADDR: "payment-service:50051"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    env_file:
      - ../.env
    environment:
      APP_DB_DSN: postgres://bangunin:bangunin@postgres:5432/bangunin?sslmode=disable
      APP_REDIS_ADDR: redis:6379
      APP_R2_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
