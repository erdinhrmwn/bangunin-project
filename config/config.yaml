app:
  name: bangunin
  env: development
  port: 8080

db:
  dsn: "postgres://bangunin:bangunin@localhost:5432/bangunin?sslmode=disable"
  max_conns: 10
  min_conns: 2
  max_conn_life: 1h

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

jwt:
  secret: "change-me-in-env"
  access_ttl: 15m
  refresh_ttl: 168h

xendit:
  secret_key: ""
  callback_token: ""

rajaongkir:
  api_key: ""
  mock: true

r2:
  access_key: "minioadmin"
  secret_key: "minioadmin"
  bucket: "bangunin-dev"
  endpoint: "localhost:9000"
  use_ssl: false

catalog:
  low_stock_threshold: 5

payment:
  grpc_addr: "localhost:50051"
  internal_secret: "change-me-in-env"
