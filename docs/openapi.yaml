openapi: 3.0.3
info:
  title: Bangunin API
  description: Building materials marketplace API (FR-7.8).
  version: '1.0'
  license:
    name: UNLICENSED
    url: https://example.com/unlicensed
servers:
- url: http://localhost:8080
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Envelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data: {}
        meta:
          type: object
          properties:
            page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            next_cursor:
              type: string
        errors: {}
  responses:
    OK:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Envelope'
security:
- bearerAuth: []
paths:
  /health:
    get:
      tags:
      - system
      summary: Health check
      security: []
      responses:
        '200':
          $ref: '#/components/responses/OK'
        4XX:
          $ref: '#/components/responses/Error'
      operationId: getHealth
  /internal/payments/callback:
    post:
      tags:
      - internal
      summary: Xendit payment webhook (X-Internal-Secret header, no JWT)
      security: []
      responses:
        '200':
          $ref: '#/components/responses/OK'
        4XX:
          $ref: '#/components/responses/Error'
      operationId: postInternalPaymentsCallback
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Register
      security: []
      responses:
        '200':
          $ref: '#/components/responses/OK'
        4XX:
          $ref: '#/components/responses/Error'
      operationId: postApiV1AuthRegister
  /api/v1/auth/verify-email:
    post:
      tags:
      - auth
      summary: Verify email OTP
      security: []
      responses:
        '200':
          $ref: '#/components/responses/OK'
        4XX:
          $ref: '#/components/responses/Error'
      operationId: postApiV1AuthVerifyEmail
  /api/v1/auth/resend-otp:
    post:
      tags:
      - auth
      summary: Resend OTP
      security: []
      responses:
        '200':
          $ref: '#/components/responses/OK'
        4XX:
          $ref: '#/components/responses/Error'
      operationId: postApiV1AuthResendOtp
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      security: []
      responses:
        '200':
          $ref: '#/components/responses/OK'
        4XX:
          $ref: '#/components/responses/Error'
      operationId: postApiV1AuthLogin
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh access token
      security: []
      responses:
        '200':
          $ref: '#/components/responses/OK'
        4XX:
          $ref: '#/components/responses/Error'
      operationId: postApiV1AuthRefresh
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      security: []
      responses:
        '200':
          $ref: '#/components/responses/OK'
        4XX:
          $ref: '#/components/responses/Error'
      operationId: postApiV1AuthLogout
  /api/v1/auth/forgot-password:
    post:
      tags:
      - auth
      summary: Forgot password
      security: []
      responses:
        '200':
          $ref: '#/components/responses/OK'
        4XX:
          $ref: '#/components/responses/Error'
      operationId: postApiV1AuthForgotPassword
  /api/v1/auth/reset-password:
    post:
      tags:
      - auth
      summary: Reset password
      security: []
      responses:
        '200':
          $ref: '#/components/responses/OK'
        4XX:
          $ref: '#/components/responses/Error'
      operationId: postApiV1AuthResetPassword
  /api/v1/user/me:
    get:
      tags:
      - user
      summary: Get my profile
      responses:
        '200':
          $ref: '#/components/responses/OK'
        4XX:
          $ref: '#/components/responses/Error'
      operationId: getApiV1UserMe
    patch:
      tags:
      - user
      summary: Update my profile
      responses:
        '200':
          $ref: '#/components/responses/OK'
        4XX:
          $ref: '#/components/responses/Error'
      operationId: patchApiV1UserMe
  /api/v1/user/me/password:
    patch:
